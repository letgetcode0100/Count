<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown | Celebrate Every Moment</title>
    <meta name="description" content="A premium birthday countdown timer to track every second until the big day.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="particles-js"></div>
    <main class="container">
        <div class="countdown-card" id="countdownCard">
            <header class="card-header">
                <span class="badge" id="celebrantBadge">Happy Birthday!</span>
                <h1 id="celebrantNameText">Birthday Countdown</h1>
                <p id="targetDateText">Loading date...</p>
            </header>

            <div class="timer-grid">
                <div class="timer-item">
                    <span class="time-value" id="days">00</span>
                    <span class="time-label">DAYS</span>
                </div>
                <div class="timer-item">
                    <span class="time-value" id="hours">00</span>
                    <span class="time-label">HOURS</span>
                </div>
                <div class="timer-item">
                    <span class="time-value" id="minutes">00</span>
                    <span class="time-label">MINUTES</span>
                </div>
                <div class="timer-item">
                    <span class="time-value" id="seconds">00</span>
                    <span class="time-label">SECONDS</span>
                </div>
            </div>

            <div class="festive-message" id="message">
                Something amazing is about to happen! 🎈
            </div>

            <footer class="creator-footer">
                Designed & Developed by <span class="creator-name">Ishant Raj</span>
            </footer>
        </div>
    </main>

    <audio id="birthdaySong" preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        <!-- You can replace the src with your own 'birthday-song.mp3' file -->
    </audio>

    <canvas id="confetti-canvas"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
